<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoring System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background-color: #f4f6f8;
        }

        h1 {
            color: #333;
        }

        h2 {
            margin-top: 30px;
        }

        input {
            padding: 10px;
            margin: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            padding: 9px 15px;
            margin: 3px;
            border: none;
            border-radius: 4px;
            background-color: #007bff;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        .dashboard-cards {
            display: flex;
            flex-direction: row;
            gap: 20px;
            width: 100%;
            margin: 20px 0 30px;
        }

        .dashboard-card {
            flex: 1;
            min-width: 0;
            background-color: white;
            padding: 24px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
        }

        .dashboard-card h3 {
            color: #555;
            font-size: 16px;
            margin-bottom: 12px;
        }

        .dashboard-card p {
            font-size: 32px;
            font-weight: bold;
            margin: 0;
            color: #222;
        }

        .dashboard-card:nth-child(2) p {
            color: #16a34a;
        }

        .dashboard-card:nth-child(3) p {
            color: #dc2626;
        }

        @media (max-width: 600px) {
            .dashboard-cards {
                flex-direction: column;
            }
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            background-color: white;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background-color: #333;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        .edit-btn {
            background-color: #ffc107;
            color: black;
        }

        .edit-btn:hover {
            background-color: #e0a800;
        }

        .delete-btn {
            background-color: #dc3545;
        }

        .delete-btn:hover {
            background-color: #b02a37;
        }

        /* Modern HTML Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 8px;
            width: 360px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .modal-content h3 {
            margin-top: 0;
            margin-bottom: 15px;
            color: #333;
        }

        .modal-content input {
            width: 90%;
            display: block;
            margin-bottom: 12px;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 15px;
        }

        .cancel-btn {
            background-color: #6c757d;
        }

        .cancel-btn:hover {
            background-color: #5a6268;
        }
    </style>
</head>
<body>

    <h1>Monitoring System</h1>

    <h2>Dashboard Overview</h2>
    <div class="dashboard-cards">
        <div class="dashboard-card">
            <h3>Total Devices</h3>
            <p id="totalDevices">0</p>
        </div>
        <div class="dashboard-card">
            <h3>UP Devices 🟢</h3>
            <p id="upDevices">0</p>
        </div>
        <div class="dashboard-card">
            <h3>DOWN Devices 🔴</h3>
            <p id="downDevices">0</p>
        </div>
    </div>

    <h2>Add New Device</h2>
    <form id="add-device-form">
        <input 
            type="text" 
            id="device-name" 
            placeholder="Device Name" 
            required
        >
        <input 
            type="text" 
            id="device-ip" 
            placeholder="IP Address" 
            required
        >
        <input 
            type="text" 
            id="device-type" 
            placeholder="Device Type" 
            required
        >
        <button type="submit">Add Device</button>
    </form>

    <h2>Devices</h2>
    <button type="button" onclick="loadDevices()">
        Refresh Devices
    </button>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>IP Address</th>
                <th>Status</th>
                <th>Edit</th>
                <th>Delete</th>
            </tr>
        </thead>
        <tbody id="device-table"></tbody>
    </table>

    <h2>Monitoring History</h2>
    <table>
        <thead>
            <tr>
                <th>Device</th>
                <th>Old Status</th>
                <th>New Status</th>
                <th>Changed At</th>
            </tr>
        </thead>
        <tbody id="historyTableBody"></tbody>
    </table>

    <!-- Edit Device Modal -->
    <div id="edit-modal" class="modal-overlay">
        <div class="modal-content">
            <h3>Edit Device</h3>
            <input type="hidden" id="edit-device-id">
            <label>Device Name:</label>
            <input type="text" id="edit-device-name" required>
            <label>IP Address:</label>
            <input type="text" id="edit-device-ip" required>
            <label>Device Type:</label>
            <input type="text" id="edit-device-type" required>
            <div class="modal-actions">
                <button type="button" class="cancel-btn" onclick="closeEditModal()">Cancel</button>
                <button type="button" onclick="saveDeviceEdit()">Save Changes</button>
            </div>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="delete-modal" class="modal-overlay">
        <div class="modal-content">
            <h3>Confirm Deletion</h3>
            <p id="delete-modal-text">Are you sure you want to delete this device?</p>
            <input type="hidden" id="delete-device-id">
            <div class="modal-actions">
                <button type="button" class="cancel-btn" onclick="closeDeleteModal()">Cancel</button>
                <button type="button" class="delete-btn" onclick="confirmDeviceDelete()">Delete</button>
            </div>
        </div>
    </div>

    <script src="script.js?v=2"></script>
</body>
</html>
